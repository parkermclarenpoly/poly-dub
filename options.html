<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Poly Dub Settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <header class="brand-bar">
      <div class="brand">
        <img src="icons/icon-48.png" width="36" height="36" alt="">
        <div>
          <h1>Poly Dub</h1>
          <p>Team link settings</p>
        </div>
      </div>
      <span class="status-chip" id="connectionStatus">Not configured</span>
    </header>

    <main>
      <form id="settingsForm" class="settings-panel">
        <section class="access-section" aria-labelledby="accessHeading">
          <div class="section-heading">
            <div>
              <h2 id="accessHeading">Team access</h2>
              <p>Enter the shared Polymarket password once on this browser.</p>
            </div>
            <span class="access-state" id="accessState">Locked</span>
          </div>
          <label for="teamPassword">Team password</label>
          <input id="teamPassword" type="password" autocomplete="current-password" placeholder="Enter team password">
        </section>

        <fieldset class="tag-fieldset">
          <legend>Saved link tags</legend>
          <div class="add-tag-row">
            <input id="newTag" type="text" autocomplete="off" spellcheck="false" placeholder="@Polymarket">
            <button id="addTag" class="secondary-button" type="button">Add tag</button>
          </div>
          <div id="tagList" class="tag-list"></div>
        </fieldset>

        <label class="mode-toggle" for="askEachTime">
          <input id="askEachTime" type="checkbox">
          <span>
            <strong>Ask me which tag each time</strong>
            <small>Otherwise the default tag is used immediately.</small>
          </span>
        </label>

        <div class="actions">
          <button class="primary-button" type="submit">Save and continue</button>
        </div>
        <p id="formStatus" class="form-status" aria-live="polite"></p>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
