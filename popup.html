<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose PolyLinks account</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="28" height="28" alt="">
      <div>
        <h1>Choose account</h1>
        <p>Poly Dub · PolyLinks</p>
      </div>
    </header>
    <section class="us-destination">
      <label for="usDestination">US market URL <span>(optional)</span></label>
      <input id="usDestination" type="url" placeholder="https://polymarket.us/event/market-name" autocomplete="off" aria-describedby="usDestinationHelp">
      <p id="usDestinationHelp">On a DeFi page, use this US destination for the new link. Leave blank for automatic matching.</p>
    </section>
    <main id="accountButtons" aria-label="Your PolyLinks accounts"></main>
    <footer>
      <span id="status" role="status" aria-live="polite" aria-atomic="true"></span>
      <button id="openSettings" type="button">Settings</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
